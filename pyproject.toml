[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-quant"
version = "0.2.0"
description = "Explainable Borsa Istanbul (BIST) swing-trading scanner and signal engine (Phase 1: technical core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",  # Windows has no system time-zone database
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "openpyxl>=3.1"]
gui = ["PySide6-Essentials>=6.6", "matplotlib>=3.8", "openpyxl>=3.1"]
llm = ["anthropic>=1.0"]

[project.scripts]
bist-quant = "bist_quant.main:main"

[project.gui-scripts]
bistwatcher = "bist_quant.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bist_quant = ["gui/icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
