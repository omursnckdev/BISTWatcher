name: Windows app

on:
  push:
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write  # only used to attach files to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
      - name: Build BISTWatcher.exe
        run: pyinstaller packaging/windows/BISTWatcher.spec --noconfirm
      - name: Self-test the built app (offline demo data)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BISTWatcher\BISTWatcher.exe `
               -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import bist_quant; print(bist_quant.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\installer.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\BISTWatcher -DestinationPath dist\BISTWatcher-Tasinabilir.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BISTWatcher-Kurulum
          path: dist/BISTWatcher-Kurulum.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BISTWatcher-Tasinabilir
          path: dist/BISTWatcher/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BISTWatcher-Kurulum.exe
            dist/BISTWatcher-Tasinabilir.zip
