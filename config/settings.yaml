# Runtime settings for the BIST Quant scanner (Phase 1: technical core).
# Every parameter here is a starting hypothesis to be validated by backtesting,
# not a tuned value.

data:
  provider: yahoo            # yahoo | csv | synthetic
  history_days: 800          # calendar days requested; EMA200 needs >= ~300 sessions
  raw_dir: data/raw          # raw source data is stored here (CSV per symbol)
  cache_ttl_hours: 6         # re-use cached raw data younger than this
  use_adjusted_prices: true  # indicators run on split/dividend-adjusted OHLC
  exclude_incomplete_session: true  # drop today's bar while the BIST session is still open
  session_close_time: "18:15"       # Europe/Istanbul; after this the daily bar is final
  max_data_age_days: 5       # calendar days; older data => NO_TRADE (stale-data protection)
  max_missing_sessions: 2    # sessions behind the index calendar => treated as suspended/stale
  min_history_bars: 250      # fewer bars => symbol skipped (indicator warm-up)
  request_concurrency: 4
  request_timeout_seconds: 20
  max_retries: 4

indicators:
  ema_fast: 20
  ema_medium: 50
  ema_long: 100
  ema_slow: 200
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  adx_period: 14
  volume_ma_period: 20
  roc_period: 10
  rs_windows: [5, 20, 60]

market_regime:
  index: XU100
  secondary_index: XU030
  high_vol_lookback: 252          # sessions used for the ATR% percentile
  high_vol_percentile: 0.90       # ATR% above this percentile => HIGH_VOLATILITY ...
  high_vol_min_ratio: 1.25        # ... and at least this multiple of its 1-year median
  drawdown_lookback: 60
  high_vol_drawdown_pct: 15.0     # index drawdown from rolling high => HIGH_VOLATILITY
  breadth_healthy_pct: 50.0       # % of universe above EMA50 considered healthy
  min_breadth_symbols: 10         # fewer fresh symbols => breadth is left out of the score

strategy:
  profile: SWING
  # Minimum score for BUY_CANDIDATE depends on the market regime.
  buy_threshold:
    BULL: 75
    NEUTRAL: 80
    HIGH_VOLATILITY: 85
    BEAR: 88
  buy_threshold_offset: 0     # added to every regime threshold (used for robustness sweeps)
  strong_buy_margin: 10       # STRONG_BUY_CANDIDATE = buy_threshold + margin
  weak_setup_threshold: 65
  watch_threshold: 50
  block_buys_in_bear: false   # true => never emit BUY in a BEAR regime

risk:
  atr_stop_multiplier: 2.0
  tp1_r: 1.5
  tp2_r: 2.5
  minimum_rr: 2.0
  entry_zone_atr: 0.25        # entry zone = close +/- this * ATR
  use_resistance_cap: true    # cap reward at overhead resistance when it sits below TP2
  resistance_lookback: 120
  portfolio_equity: 500000    # TRY
  risk_per_trade_pct: 1.0
  max_position_pct: 20.0      # cap a single position at this % of equity
  lot_size: 1                 # BIST equities trade in 1-share lots
  # Portfolio-level limits (backtest now, paper trading later)
  max_open_positions: 8
  max_portfolio_risk_pct: 5.0     # sum of (entry - stop) * shares still at risk across positions
  max_sector_exposure_pct: 25.0   # position value per sector (sectors from universe.yaml)

liquidity:
  min_avg_turnover_try: 50000000   # 20D average daily turnover (close * volume)
  # Share-count minimum. 0 = off: a share count means nothing across price levels
  # (a 5,000 TRY stock trading 40k shares/day is ~200M TRY of turnover).
  min_avg_volume: 0

news:                         # Phase 3: KAP disclosures -> 0-15 news score
  enabled: true
  # rules  : deterministic Turkish KAP rules (free; used for historical backtests)
  # claude : every disclosure classified by the LLM (needs ANTHROPIC_API_KEY, costs money)
  # hybrid : rules for routine filings, LLM only for potentially material ones
  classifier: rules
  source_quality: {kap: 1.0}
  # Sentiment overrides ("event_type/tone" or "event_type"), e.g. {dividend: 0.0}.
  # Empty = the rule/LLM sentiment is used as is. An event-study-based set (neutralising
  # bonus issues, insider trades, investment, dividend, M&A) did NOT improve the
  # backtest - see docs/phase3_findings.md.
  sentiment_overrides: {}
  session_close_time: "18:00" # disclosures after the close belong to the next session
  cutoff_time: "18:15"        # news published up to T 18:15 counts for T's signal
  saturation: 0.6             # net impact where the score is ~76% of the way to 0 / 15
  min_importance: 0.05        # ignore events below this importance
  fetch_details: true         # download disclosure text for the types below (amounts, LLM)
  detail_event_types: [new_contract, government_contract, export_deal, investment,
                       capacity_expansion, merger_acquisition]
  detail_max_per_run: 200    # per scan/backtest; `kap-sync --details` backfills everything
  kap_dir: data/raw/kap
  sync: true                  # download missing KAP months before scanning/backtesting
  decay:
    mode: exponential         # exponential | step (spec table)
    half_life_hours: {short: 24, medium: 72, long: 168}
    max_age_days: 10
    step_table: [[6, 1.0], [24, 0.7], [72, 0.4], [168, 0.15]]
  reaction:                   # news vs price reaction (spec section 24)
    enabled: true
    window_sessions: 1
    threshold_atr: 0.5        # excess move vs XU100 beyond 0.5 ATR = a reaction
    neutral_band: 0.1
    # impact multiplier per news-vs-reaction label (spec section 24 hypotheses)
    multipliers:
      POSITIVE_NEWS_POSITIVE_REACTION: 1.2   # confirmation
      POSITIVE_NEWS_NO_REACTION: 0.5         # good news ignored
      POSITIVE_NEWS_NEGATIVE_REACTION: -0.5  # good news sold off => weakness
      NEGATIVE_NEWS_NEGATIVE_REACTION: 1.2
      NEGATIVE_NEWS_NO_REACTION: 0.5
      NEGATIVE_NEWS_POSITIVE_REACTION: -0.5  # bad news bought => strength
    infer_neutral: both       # off | negative | both: neutral news + reaction => sentiment
    implied_max: 0.6
    min_importance_for_inference: 0.5
  scale:                      # contract value vs market cap (spec section 23)
    enabled: true
    reference_ratio: 0.01     # amount = 1% of market cap => neutral
    sensitivity: 0.5
    min_multiplier: 0.5
    max_multiplier: 2.0
  llm:
    model: claude-opus-5
    effort: low               # classification does not need deep reasoning
    max_text_chars: 6000
    concurrency: 4
    cache_dir: data/cache/llm
    use_fallbacks: true

institutional_flow:
  enabled: false              # Phase 4
  lookbacks: [1, 3, 5, 10]
